apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
# THE IMPORTANT LINE. Immediate binding provisions the volume the moment the
# PVC is created -- in whatever AZ the controller picks -- and then the pod
# may be scheduled somewhere else and can never attach. WaitForFirstConsumer
# defers provisioning until the scheduler has chosen a node, so the volume is
# created in the right AZ.
volumeBindingMode: WaitForFirstConsumer
