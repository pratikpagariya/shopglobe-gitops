apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-jwt
  namespace: shopglobe-dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-jwt
  # Terraform stored {"JWT_SECRET": "..."}, so extract gives the pod exactly
  # one env var with the name the app already reads.
  dataFrom:
    - extract:
        key: shopglobe/dev/auth-jwt
