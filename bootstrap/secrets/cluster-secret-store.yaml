apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      # NO auth block. Omitting it means "use the controller pod's ambient
      # credentials" -- which Pod Identity supplies. A jwt.serviceAccountRef
      # here would be the IRSA path: ESO exchanging a projected SA token with
      # STS itself. With Pod Identity that exchange already happened before
      # the process started, so there is nothing for ESO to do.
