apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: shopglobe-dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalog-db
    # Terraform stores structured fields; the app wants one connection string.
    # The template assembles it INSIDE the cluster, so the password never
    # appears in a manifest, a values file, or git.
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: shopglobe/prod/catalog-db
