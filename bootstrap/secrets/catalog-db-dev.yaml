apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: shopglobe-dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalog-db
    # Terraform stores structured fields; the app wants one connection string.
    # The template assembles it INSIDE the cluster, so the password never
    # appears in a manifest, a values file, or git.
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/shopglobe_dev"
  # One RDS instance, one DATABASE per app env: a dev migration cannot touch
  # prod rows. Credentials are NOT isolated -- all three use the master user;
  # per-env roles are the next step. The migrate Job creates the database.
  dataFrom:
    - extract:
        key: shopglobe/prod/catalog-db
