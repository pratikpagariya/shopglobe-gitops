apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/description: >-
      Containers must run as non-root. dev and stage only enforce the PSA
      `baseline` profile, which does not require this -- so here this policy
      is the only thing that does.
# The spec header (Audit, fail closed, autogen, namespace scope) is identical
# across all five policies -- disallow-latest-tag.yaml explains each field.
spec:
  validationActions: [Audit]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, jobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [shopglobe-dev, shopglobe-stage, shopglobe-prod]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # The container's own setting wins; if it has none, the pod-level one
    # applies; if neither is set, the container may run as root -> rejected.
    - expression: >-
        variables.allContainers.all(c,
        c.?securityContext.?runAsNonRoot.orValue(
        object.spec.?securityContext.?runAsNonRoot.orValue(false)))
      message: "Containers must set runAsNonRoot: true (on the container or the pod)."
