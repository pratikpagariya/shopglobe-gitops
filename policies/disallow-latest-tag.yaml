apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: >-
      Every image must carry a tag, and it must not be `latest`. With a mutable
      tag, two pods "on the same version" can be running different code.
spec:
  # Rollout step 2 of 2: Deny. Step 1 ran in Audit (violations recorded in
  # policy reports, nothing blocked) until all 8 services reported clean.
  validationActions: [Deny]
  # Fail CLOSED: if Kyverno is unreachable, matching requests are refused.
  # The alternative (Ignore) means an outage silently turns enforcement off.
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true  # also report on pods that already exist
  # Check the Deployment/Job itself, not only the Pods it later creates: a bad
  # image fails the ArgoCD sync with this message, instead of surfacing as a
  # ReplicaSet that silently cannot create pods.
  autogen:
    podControllers:
      controllers: [deployments, jobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # App namespaces only. Jenkins agents and platform charts pull public
    # images by design.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [shopglobe-dev, shopglobe-stage, shopglobe-prod]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: "variables.allContainers.all(c, c.image.contains(':'))"
      message: "Every image needs an explicit tag."
    - expression: "variables.allContainers.all(c, !c.image.endsWith(':latest'))"
      message: "':latest' is mutable -- deploy by immutable tag (the git SHA)."
