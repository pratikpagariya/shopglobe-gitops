image:
  repository: shopglobe-prod-edge-gateway
  tag: ""  # PROMOTED, never built here: a PR copies the tag that passed dev
replicaCount: 1
env:
  LOG_LEVEL: INFO
  MARKET: in
# Upstreams default to http://<svc>:8000 -- a short name, so it resolves inside
# this pod's own namespace. stage's gateway can only ever reach stage's services.
