image:
  repository: shopglobe-prod-cart-svc
  tag: ""  # PROMOTED, never built here: a PR copies the tag that passed stage
replicaCount: 2  # one pod lost to a spot reclaim is not an outage
env:
  LOG_LEVEL: INFO
  MARKET: in
  # rediss:// = TLS (transit encryption is on). /0 = dev, /1 = stage, /2 = prod.
  # From `terraform output -raw redis_endpoint` (stable per account+region).
  REDIS_URL: "rediss://master.shopglobe-prod-redis.qapl0r.aps1.cache.amazonaws.com:6379/2"
