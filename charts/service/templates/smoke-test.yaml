{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "service.name" . }}-smoke
  labels: {{- include "service.labels" . | nindent 4 }}
  annotations:
    # PostSync: runs only after every resource in the sync is Healthy. It
    # turns "the Deployment rolled out" into "the service answers through its
    # Service" -- a different, stronger claim.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: {{- include "service.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: smoke
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Replaces the image ENTRYPOINT (python -m): this is a short script,
          # not a module. Retries because a dependency (edge-gateway -> auth)
          # may still be rolling out in a parallel sync.
          command: ["python", "-c"]
          args:
            - |
              import sys, time, urllib.request
              url = "http://{{ include "service.name" . }}:{{ .Values.service.port }}/readyz"
              for attempt in range(1, 13):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as r:
                          print(f"ready on attempt {attempt}: {r.read().decode()}")
                          sys.exit(0)
                  except Exception as exc:
                      print(f"attempt {attempt}: {type(exc).__name__}: {exc}")
                      time.sleep(5)
              sys.exit(1)
          resources: {{- toYaml .Values.hookResources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
